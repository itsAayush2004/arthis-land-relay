<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Arthis.Land Relay</title><desc id="d">Animated banner: four players join a room and their packets pass through the relay, which broadcasts them to the others over TCP and WebSocket.</desc><style>@font-face{font-family:AC;font-weight:900;src:url(data:font/woff2;base64,) format("woff2")}
